services:
  backend:
    image: ghcr.io/jayeeeesh/rentease-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env.production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/jayeeeesh/rentease-frontend:latest
    ports:
      - "3000:80"