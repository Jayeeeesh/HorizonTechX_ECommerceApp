apiVersion: v1
kind: Service

metadata:
  name: rentease-frontend
  namespace: rentease
  labels:
    app.kubernetes.io/name: rentease-frontend
    app.kubernetes.io/part-of: rentease
    app.kubernetes.io/component: frontend

spec:
  type: ClusterIP

  selector:
    app: rentease-frontend

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

  sessionAffinity: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4