apiVersion: apps/v1
kind: Deployment

metadata:
  name: rentease-frontend
  namespace: rentease
  labels:
    app.kubernetes.io/name: rentease-frontend
    app.kubernetes.io/part-of: rentease
    app.kubernetes.io/component: frontend

spec:
  replicas: 2
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: rentease-frontend

  template:
    metadata:
      labels:
        app: rentease-frontend

    spec:
      terminationGracePeriodSeconds: 30

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

      containers:
        - name: frontend
          image: ghcr.io/jayeeeesh/rentease-frontend:latest
          imagePullPolicy: Always

          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

          ports:
            - name: http
              containerPort: 80

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
            readOnlyRootFilesystem: false

      restartPolicy: Always
