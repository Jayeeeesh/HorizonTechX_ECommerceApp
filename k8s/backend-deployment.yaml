apiVersion: apps/v1
kind: Deployment

metadata:
  name: rentease-backend
  namespace: rentease
  labels:
    app.kubernetes.io/name: rentease-backend
    app.kubernetes.io/part-of: rentease
    app.kubernetes.io/component: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: rentease-backend

  template:
    metadata:
      labels:
        app: rentease-backend

    spec:
      containers:
        - name: backend
          image: ghcr.io/jayeeeesh/rentease-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
              name: http

          envFrom:
            - configMapRef:
                name: rentease-config
            - secretRef:
                name: rentease-secrets

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

      restartPolicy: Always